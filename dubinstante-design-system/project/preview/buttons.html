<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--surface);display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:0 14px;height:36px;border-radius:10px;font:600 13px/1 var(--font-sans);cursor:pointer;border:1px solid transparent;transition:all var(--dur-fast) var(--ease-out);}
  .primary{background:var(--accent);color:var(--on-accent);}
  .primary:hover{background:var(--accent-hover);}
  .ghost{background:transparent;color:var(--fg1);border-color:var(--border-strong);}
  .ghost:hover{background:var(--surface-hover);}
  .soft{background:var(--accent-soft);color:var(--accent-press);}
  .soft:hover{background:var(--accent-soft-2);}
  .danger{background:var(--danger);color:#fff;text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
  .icon{width:36px;height:36px;padding:0;justify-content:center;border-radius:10px;background:var(--surface);border:1px solid var(--border-strong);color:var(--fg1);}
  .icon:hover{background:var(--surface-hover);}
  svg{width:16px;height:16px;}
</style></head>
<body>
  <button class="btn primary">Sauvegarder</button>
  <button class="btn ghost">Cancel</button>
  <button class="btn soft">Personnaliser</button>
  <button class="btn danger">● REC</button>
  <button class="btn icon" title="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="btn icon" title="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
  <button class="btn primary" disabled style="opacity:.5;cursor:not-allowed">Disabled</button>
</body></html>
