<!doctype html>
<html><head><meta charset="utf-8"><title>Form inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--surface);display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;align-items:start;}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font:500 11px/1 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--fg3);}
  input,select{height:36px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font:500 13px/1 var(--font-sans);color:var(--fg1);outline:none;transition:all var(--dur-fast) var(--ease-out);}
  input:focus,select:focus{border-color:var(--border-focus);box-shadow:var(--ring-focus);}
  .spin{display:flex;align-items:center;gap:6px;}
  .spin input{text-align:right;font-family:var(--font-mono);width:90px;}
  .check{display:flex;align-items:center;gap:8px;font:500 13px/1 var(--font-sans);color:var(--fg1);}
  .check input{appearance:none;width:16px;height:16px;border:1.5px solid var(--border-strong);border-radius:4px;background:var(--surface);position:relative;cursor:pointer;}
  .check input:checked{background:var(--accent);border-color:var(--accent);}
  .check input:checked::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
</style></head>
<body>
  <div class="field"><label>Email</label><input placeholder="you@studio.fr"></div>
  <div class="field"><label>Microphone</label><select><option>Shure SM7B (USB)</option></select></div>
  <div class="field"><label>Vitesse Défilement</label><div class="spin"><input type="text" value="100%"/></div></div>
  <div class="field"><label>Volume</label><div class="spin"><input type="text" value="64%"/></div></div>
  <label class="check"><input type="checkbox" checked> Activer 2e piste</label>
  <label class="check"><input type="checkbox"> Texte Blanc</label>
</body></html>
