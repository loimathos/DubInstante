<!doctype html>
<html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);display:grid;grid-template-columns:repeat(6,1fr);gap:14px;}
  .ic{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--border);border-radius:8px;}
  .ic img{width:24px;height:24px;}
  .ic span{font:500 10px/1 var(--font-mono);color:var(--fg3);}
</style></head>
<body>
  <div class="ic"><img src="../assets/icons/play.svg"><span>play</span></div>
  <div class="ic"><img src="../assets/icons/pause.svg"><span>pause</span></div>
  <div class="ic"><img src="../assets/icons/stop.svg"><span>stop</span></div>
  <div class="ic"><img src="../assets/icons/record.svg"><span>record</span></div>
  <div class="ic"><img src="../assets/icons/volume.svg"><span>volume</span></div>
  <div class="ic"><img src="../assets/icons/folder_open.svg"><span>folder</span></div>
  <div class="ic"><img src="../assets/icons/arrow_up.svg"><span>up</span></div>
  <div class="ic"><img src="../assets/icons/arrow_down.svg"><span>down</span></div>
  <div class="ic"><img src="../assets/icons/arrow_left.svg"><span>left</span></div>
  <div class="ic"><img src="../assets/icons/arrow_right.svg"><span>right</span></div>
</body></html>
