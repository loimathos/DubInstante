<!doctype html>
<html><head><meta charset="utf-8"><title>Track panel</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--neutral-50);}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:14px;align-items:center;}
  .idx{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent-press);display:flex;align-items:center;justify-content:center;font:700 13px/1 var(--font-sans);}
  .name{font:600 13px/1.2 var(--font-sans);color:var(--fg1);}
  .dev{font:500 11px/1.2 var(--font-mono);color:var(--fg3);margin-top:2px;}
  select{height:30px;border:1px solid var(--border-strong);border-radius:6px;padding:0 8px;font:500 12px var(--font-sans);background:var(--surface);}
  .meter{width:120px;height:8px;background:var(--neutral-100);border-radius:4px;overflow:hidden;}
  .meter span{display:block;width:58%;height:100%;background:linear-gradient(90deg,var(--success) 0,var(--warning) 85%,var(--danger));}
  .gain{font:600 12px/1 var(--font-mono);color:var(--fg2);min-width:48px;text-align:right;}
  .mute{width:30px;height:30px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;font:700 11px var(--font-sans);color:var(--fg2);cursor:pointer;}
</style></head>
<body>
  <div class="panel">
    <div class="idx">1</div>
    <div>
      <div class="name">Piste 1 — Dialogue principal</div>
      <div class="dev">Shure SM7B · 48 kHz</div>
    </div>
    <select><option>Shure SM7B (USB)</option></select>
    <div class="meter"><span></span></div>
    <div class="gain">+6 dB</div>
    <button class="mute">M</button>
  </div>
</body></html>
