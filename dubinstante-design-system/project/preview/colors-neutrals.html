<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
  .sw{aspect-ratio:1;border-radius:8px;position:relative;border:1px solid rgba(0,0,0,.04);}
  .sw span{position:absolute;inset:auto 0 6px 0;text-align:center;font:500 10px/1 var(--font-mono);color:var(--fg2);}
  .sw.dark span{color:#fff;}
  .cap{margin-top:10px;font:500 11px/1 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--fg3);}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--neutral-0);border-color:var(--neutral-200)"><span>0</span></div>
    <div class="sw" style="background:var(--neutral-50)"><span>50</span></div>
    <div class="sw" style="background:var(--neutral-100)"><span>100</span></div>
    <div class="sw" style="background:var(--neutral-200)"><span>200</span></div>
    <div class="sw" style="background:var(--neutral-300)"><span>300</span></div>
    <div class="sw dark" style="background:var(--neutral-400)"><span>400</span></div>
    <div class="sw dark" style="background:var(--neutral-500)"><span>500</span></div>
    <div class="sw dark" style="background:var(--neutral-600)"><span>600</span></div>
    <div class="sw dark" style="background:var(--neutral-700)"><span>700</span></div>
    <div class="sw dark" style="background:var(--neutral-900)"><span>900</span></div>
  </div>
  <div class="cap">Neutral scale · cool gray</div>
</body></html>
