<!doctype html>
<html><head><meta charset="utf-8"><title>Menu</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--neutral-50);}
  .menu{width:260px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;}
  .item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;font:500 13px/1 var(--font-sans);color:var(--fg1);cursor:pointer;}
  .item:hover{background:var(--surface-hover);}
  .item.active{background:var(--accent-soft);color:var(--accent-press);}
  .item small{color:var(--fg3);font:500 11px var(--font-mono);}
  .sep{height:1px;background:var(--border);margin:4px 2px;}
  .header{padding:8px 10px 4px;font:600 10px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);}
</style></head>
<body>
  <div class="menu">
    <div class="header">Files</div>
    <div class="item">Open MP4 <small>⌘O</small></div>
    <div class="item">Open save file</div>
    <div class="item active">Save .dbi / .zip <small>⌘S</small></div>
    <div class="sep"></div>
    <div class="header">Bande Rythmo</div>
    <div class="item">Personnaliser</div>
    <div class="item">Exporter la bande rythmo</div>
  </div>
</body></html>
