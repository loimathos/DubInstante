<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .chip{border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;}
  .dot{width:32px;height:32px;border-radius:8px;flex-shrink:0;}
  .meta{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .name{font:600 13px/1.2 var(--font-sans);color:var(--fg1);}
  .hex{font:500 11px/1 var(--font-mono);color:var(--fg3);}
</style></head>
<body>
  <div class="grid">
    <div class="chip"><div class="dot" style="background:var(--success)"></div><div class="meta"><div class="name">Success</div><div class="hex">#0EA66B</div></div></div>
    <div class="chip"><div class="dot" style="background:var(--warning)"></div><div class="meta"><div class="name">Warning</div><div class="hex">#D98B00</div></div></div>
    <div class="chip"><div class="dot" style="background:var(--danger)"></div><div class="meta"><div class="name">Danger / REC</div><div class="hex">#E2344D</div></div></div>
    <div class="chip"><div class="dot" style="background:var(--info)"></div><div class="meta"><div class="name">Info</div><div class="hex">#2D7FF9</div></div></div>
  </div>
</body></html>
