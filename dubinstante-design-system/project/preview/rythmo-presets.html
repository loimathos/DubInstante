<!doctype html>
<html><head><meta charset="utf-8"><title>Rythmo presets</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .p{border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:all var(--dur-fast);}
  .p:hover{border-color:var(--border-focus);box-shadow:var(--ring-focus);}
  .p.sel{border-color:var(--accent);box-shadow:var(--ring-focus);}
  .sw{height:56px;display:flex;align-items:center;justify-content:center;font:600 14px/1 var(--font-sans);}
  .label{padding:6px 8px;font:500 11px/1 var(--font-mono);color:var(--fg3);text-align:center;}
</style></head>
<body>
  <div class="p sel"><div class="sw" style="background:#1a1a22;color:#fff">Aa</div><div class="label">Classic</div></div>
  <div class="p"><div class="sw" style="background:#000;color:#fff">Aa</div><div class="label">Dark</div></div>
  <div class="p"><div class="sw" style="background:#0b3a8c;color:#fff">Aa</div><div class="label">Blue</div></div>
  <div class="p"><div class="sw" style="background:#8c0b1e;color:#fff">Aa</div><div class="label">Red</div></div>
  <div class="p"><div class="sw" style="background:#0b6b3a;color:#fff">Aa</div><div class="label">Green</div></div>
  <div class="p"><div class="sw" style="background:#c4a200;color:#1a1a22">Aa</div><div class="label">Yellow</div></div>
</body></html>
