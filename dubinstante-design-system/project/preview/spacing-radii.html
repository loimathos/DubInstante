<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing & Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--surface);display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .col h4{font:600 11px/1 var(--font-sans);text-transform:uppercase;letter-spacing:.04em;color:var(--fg3);margin:0 0 12px;}
  .spaces{display:flex;gap:10px;align-items:flex-end;}
  .sp{background:var(--accent);border-radius:2px;width:14px;color:#fff;text-align:center;font:500 9px/1 var(--font-mono);display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;}
  .radii{display:flex;gap:10px;}
  .r{background:var(--purple-100);border:1px solid var(--purple-200);width:60px;height:60px;display:flex;align-items:center;justify-content:center;font:500 10px/1 var(--font-mono);color:var(--purple-700);}
</style></head>
<body>
  <div class="col">
    <h4>Spacing · 4px base</h4>
    <div class="spaces">
      <div class="sp" style="height:4px">1</div>
      <div class="sp" style="height:8px">2</div>
      <div class="sp" style="height:12px">3</div>
      <div class="sp" style="height:16px">4</div>
      <div class="sp" style="height:24px">6</div>
      <div class="sp" style="height:32px">8</div>
      <div class="sp" style="height:48px">12</div>
      <div class="sp" style="height:64px">16</div>
    </div>
  </div>
  <div class="col">
    <h4>Radii</h4>
    <div class="radii">
      <div class="r" style="border-radius:4px">4</div>
      <div class="r" style="border-radius:6px">6</div>
      <div class="r" style="border-radius:10px">10</div>
      <div class="r" style="border-radius:14px">14</div>
      <div class="r" style="border-radius:999px">∞</div>
    </div>
  </div>
</body></html>
