<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px;background:var(--neutral-50);display:grid;grid-template-columns:repeat(5,1fr);gap:24px;}
  .card{background:var(--surface);border-radius:10px;height:70px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font:500 10px/1 var(--font-mono);color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;border:1px solid rgba(0,0,0,0.02);}
</style></head>
<body>
  <div class="card" style="box-shadow:var(--shadow-xs)">xs</div>
  <div class="card" style="box-shadow:var(--shadow-sm)">sm</div>
  <div class="card" style="box-shadow:var(--shadow-md)">md</div>
  <div class="card" style="box-shadow:var(--shadow-lg)">lg</div>
  <div class="card" style="box-shadow:var(--shadow-accent);border:1px solid var(--purple-200)">accent</div>
</body></html>
