<!doctype html>
<html><head><meta charset="utf-8"><title>Rythmo band</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#0c0c11;}
  .stage{background:#000;border-radius:10px;overflow:hidden;padding:40px 0 0;position:relative;height:150px;box-sizing:border-box;}
  .band{position:absolute;left:0;right:0;bottom:14px;height:88px;background:var(--rythmo-bg);backdrop-filter:none;border-top:1px solid var(--rythmo-track-sep);border-bottom:1px solid var(--rythmo-track-sep);display:flex;align-items:center;overflow:hidden;}
  .text{white-space:nowrap;font:500 26px/1 var(--font-sans);padding-left:120px;letter-spacing:.01em;}
  .past{color:var(--rythmo-spoken);}
  .now{color:#fff;}
  .future{color:rgba(255,255,255,.75);}
  .cursor{position:absolute;top:40px;bottom:14px;left:46%;width:2px;background:var(--rythmo-cursor);box-shadow:0 0 8px rgba(156,124,255,.7);}
  .badge{position:absolute;top:10px;left:16px;font:600 10px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);}
  .tc{position:absolute;top:10px;right:16px;font:500 11px/1 var(--font-mono);color:rgba(255,255,255,.6);}
</style></head>
<body>
  <div class="stage">
    <div class="badge">Piste 1</div>
    <div class="tc">00:01:24.200</div>
    <div class="band">
      <div class="text"><span class="past">— Tu crois vraiment qu'il va venir&nbsp;?</span> <span class="now">Oui, il me l'a</span> <span class="future">promis hier soir avant de partir.</span></div>
    </div>
    <div class="cursor"></div>
  </div>
</body></html>
