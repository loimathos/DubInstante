<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--surface);display:flex;align-items:center;gap:24px;}
  .mark{width:72px;height:72px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-md);}
  .mark img{width:100%;height:100%;display:block;}
  .word{font:700 32px/1 var(--font-display);letter-spacing:-.02em;color:var(--fg1);}
  .word b{color:var(--accent);font-weight:700;}
  .tag{font:500 12px/1 var(--font-mono);color:var(--fg3);margin-top:6px;letter-spacing:.02em;}
</style></head>
<body>
  <div class="mark"><img src="../assets/logo.png" alt=""></div>
  <div>
    <div class="word">Dub<b>Instante</b></div>
    <div class="tag">Professional video dubbing · rythmo band</div>
  </div>
</body></html>
