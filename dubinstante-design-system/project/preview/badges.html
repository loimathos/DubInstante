<!doctype html>
<html><head><meta charset="utf-8"><title>Badges & chips</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--surface);display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 11px/1.2 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;}
  .rec{background:var(--danger-bg);color:var(--danger);}
  .rec .dot{width:7px;height:7px;background:var(--danger);border-radius:50%;animation:p 1.2s infinite;}
  @keyframes p{50%{opacity:.3}}
  .ok{background:var(--success-bg);color:var(--success);}
  .warn{background:var(--warning-bg);color:var(--warning);}
  .info{background:var(--info-bg);color:var(--info);}
  .neutral{background:var(--neutral-100);color:var(--fg2);}
  .brand{background:var(--accent-soft);color:var(--accent-press);}
  .count{font-family:var(--font-mono);}
</style></head>
<body>
  <span class="chip rec"><span class="dot"></span>REC · 00:12</span>
  <span class="chip ok">Synced</span>
  <span class="chip warn">Unsaved</span>
  <span class="chip info">v0.11</span>
  <span class="chip brand count">4 TRACKS</span>
  <span class="chip neutral">Expert mode</span>
</body></html>
