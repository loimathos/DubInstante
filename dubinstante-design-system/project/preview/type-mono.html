<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Mono</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--surface);display:flex;flex-direction:column;gap:18px;}
  .group{display:flex;align-items:center;gap:16px;}
  .label{width:130px;font:500 11px/1 var(--font-mono);color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;}
  .timecode{font:500 28px/1 var(--font-mono);color:var(--fg1);letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  .inline{font-family:var(--font-mono);color:var(--fg2);}
  kbd{margin-right:4px;}
</style></head>
<body>
  <div class="group"><div class="label">Timecode</div><div class="timecode">01:24:07 / 02:11:38</div></div>
  <div class="group"><div class="label">Inline</div><div class="inline">temp_dub_2.wav · 48 kHz · 64 MB</div></div>
  <div class="group"><div class="label">Shortcut</div><div><kbd>Ctrl</kbd><kbd>S</kbd> <span style="color:var(--fg3);font-size:13px">Stop recording</span></div></div>
</body></html>
