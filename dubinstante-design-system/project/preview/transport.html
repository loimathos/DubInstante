<!doctype html>
<html><head><meta charset="utf-8"><title>Transport</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--neutral-50);}
  .bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;}
  .btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .btn:hover{background:var(--surface-hover);}
  .btn svg{width:18px;height:18px;color:var(--fg1);}
  .play{background:var(--fg1);border-color:var(--fg1);}
  .play svg{color:#fff;}
  .rec{background:var(--danger);color:#fff;border:0;padding:0 14px;width:auto;height:36px;font:700 12px/1 var(--font-sans);letter-spacing:.08em;border-radius:8px;display:inline-flex;gap:6px;align-items:center;}
  .rec .d{width:8px;height:8px;border-radius:50%;background:#fff;}
  .tc{font:500 14px/1 var(--font-mono);color:var(--fg1);margin-left:4px;font-variant-numeric:tabular-nums;}
  .tc em{color:var(--fg3);font-style:normal;}
  .spacer{flex:1;}
  .scrub{flex:1;height:4px;background:var(--neutral-200);border-radius:2px;position:relative;margin:0 8px;}
  .scrub::before{content:"";position:absolute;inset:0 62% 0 0;background:var(--accent);border-radius:2px;}
  .scrub::after{content:"";position:absolute;left:38%;top:50%;width:12px;height:12px;background:var(--accent);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(124,86,245,.4);}
</style></head>
<body>
  <div class="bar">
    <button class="btn play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="btn"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
    <div class="tc">01:24:07 <em>/ 02:11:38</em></div>
    <div class="scrub"></div>
    <button class="rec"><span class="d"></span>REC</button>
  </div>
</body></html>
