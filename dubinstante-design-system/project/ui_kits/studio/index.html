<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DubInstante Studio — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
  #root { height: 100%; }
  kbd { font: 500 10px/1 var(--font-mono); padding: 2px 5px; background: var(--neutral-100);
        border: 1px solid var(--border); border-radius: 3px; color: var(--fg2); }
  select:focus, input:focus, button:focus-visible { outline: none; box-shadow: var(--ring-focus); }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="styles.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="Dialogs.jsx"></script>
<script type="text/babel" src="VideoStage.jsx"></script>
<script type="text/babel" src="RythmoOverlay.jsx"></script>
<script type="text/babel" src="TransportBar.jsx"></script>
<script type="text/babel" src="TrackPanel.jsx"></script>
<script type="text/babel" src="TrackStack.jsx"></script>
<script type="text/babel" src="StudioApp.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<StudioApp />);
</script>
</body>
</html>
